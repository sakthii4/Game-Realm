        <script>
            let allData = [];
            const parent = document.querySelector(".accesseries");

            async function getData() {
                try {
                    const request = await fetch("./data.json");

                    if (!request.ok) {
                        throw new Error(`HTTP error! Status: ${request.status}`);
                    }

                    const response = await request.json();

                    if (!response.products || !Array.isArray(response.products)) {
                        throw new Error("data.json does not contain a products array.");
                    }

                    // Get only accessories
                    allData = response.products.filter(
                        item => item.category === "Accessory"
                    );

                    console.log("Accessories:", allData);

                    makeUI();

                } catch (err) {
                    console.error("Error loading data:", err);

                    parent.innerHTML = `
                        <div class="container py-5">
                            <div class="alert alert-danger text-center">
                                <h4>Unable to load accessories</h4>
                                <p>${err.message}</p>
                                <small>
                                    Make sure <strong>data.json</strong> is in the same
                                    folder as this HTML file and run the project using
                                    Live Server.
                                </small>
                            </div>
                        </div>
                    `;
                }
            }

            function makeUI() {

                if (allData.length === 0) {
                    parent.innerHTML = `
                        <div class="container py-5">
                            <h2 class="text-center text-white">
                                No accessories found
                            </h2>
                        </div>
                    `;
                    return;
                }

                const result = `
                    <div class="container py-4">

                        <h2 class="text-center text-white mb-4">
                            All Accessories
                        </h2>

                        <div class="row g-4">

                            ${allData.map(item => `

                                <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                                    <div class="card h-100 shadow-sm">

                                        <img
                                            src="./${item.image}"
                                            class="card-img-top p-3"
                                            alt="${item.name}"
                                            style="
                                                height: 220px;
                                                object-fit: contain;
                                            "
                                            onerror="this.src='./assets/placeholder.png'"
                                        >

                                        <div class="card-body d-flex flex-column">

                                            <span class="badge bg-primary align-self-start mb-2">
                                                ${item.category}
                                            </span>

                                            <h5 class="card-title">
                                                ${item.name}
                                            </h5>

                                            <p class="text-white mb-2">
                                                <strong>Type:</strong>
                                                ${item.subcategory || "N/A"}
                                            </p>

                                            <p class="text-white mb-2">
                                                <strong>Brand:</strong>
                                                ${item.brand || "N/A"}
                                            </p>

                                            <p class="text-white mb-2">
                                                <strong>Connectivity:</strong>
                                                ${item.connectivity || "N/A"}
                                            </p>

                                            <p class="text-warning mb-2">
                                                <strong>Rating:</strong>
                                                ⭐ ${item.rating || "N/A"}
                                            </p>

                                            <div class="text-white mb-3">
                                                <strong>Compatible With:</strong>

                                                <div class="mt-2">
                                                    ${
                                                        Array.isArray(item.compatibility)
                                                            ? item.compatibility.map(device => `
                                                                <span class="badge bg-secondary me-1 mb-1">
                                                                    ${device}
                                                                </span>
                                                            `).join("")
                                                            : `<span class="badge bg-secondary">
                                                                N/A
                                                            </span>`
                                                    }
                                                </div>
                                            </div>

                                            <button
                                                type="button"
                                                class="btn btn-purple mt-auto"
                                                onclick="viewDetails('${item.id}')"
                                            >
                                                View Details
                                            </button>

                                        </div>
                                    </div>

                                </div>

                            `).join("")}

                        </div>
                    </div>
                `;

                parent.innerHTML = result;
            }

            function viewDetails(id) {

                // Convert both values to strings so number/string IDs work
                const selectedItem = allData.find(
                    item => String(item.id) === String(id)
                );

                if (!selectedItem) {
                    console.error("Product not found:", id);
                    return;
                }

                localStorage.setItem(
                    "selected_item",
                    JSON.stringify(selectedItem)
                );

                // Use relative path
                window.location.href = "./product.html";
            }

            
            // cart-size

          let cartSize = document.getElementById('cart-size')
          let cart = JSON.parse( localStorage.getItem('cart'))


           if(cart){
              cartSize.textContent = cart.length
           }





              let userName = document.getElementById('user-name')
           let user = JSON.parse(localStorage.getItem('gamerealmCurrentUser'))


                    function logOut(){
                         let userInput = confirm('Do you want to Log out...?')

                         if(userInput){
                            
                             localStorage.removeItem('gamerealmCurrentUser')
                             alert('Log out successfully')


                             window.location.href = './index.html'

                         }

                    }


                    if(user){
                        userName.textContent = user.username;
                        userName.classList.remove('btn-purple')
                        userName.classList.add('btn-outline-primary')
                        userName.classList.add('text-white')
                        userName.onclick = logOut

                    }
          
          // 





            getData();
        </script>
