      <script>

          let allData;
          let parent = document.querySelector(".consoles");

          async function getData() {
              try {

                  let request = await fetch("data.json");
                  let response = await request.json();

                  // Get only consoles from the simple JSON
                  allData = response.products.filter(
                      item => item.category === "Game"
                  );

                  console.log(allData);

                  makeUI();

              } catch (err) {
                  console.log(err);
              }
          }

    
      

        
        function makeUI() {
            let result = `
                <div class="container py-4">

                    <h2 class="text-center text-white mb-4">
                        All Games
                    </h2>

                    <div class="row g-4">

                        ${allData.map((item) => `

                            <div class="col-12 col-sm-6 col-md-4 col-lg-3">

                                <div class="card h-100 shadow-sm">

                                <img
                                        src="./${item.image}"
                                        class="card-img-top p-3"
                                        alt="${item.name}"
                                        style="
                                            height: 220px;
                                            object-fit: contain;
                                        "
                                        onerror="console.log('Image failed:', this.src)"
                                    />
                                    <div class="card-body d-flex flex-column">

                                        <!-- Category -->
                                        <span class="badge bg-primary align-self-start mb-2">
                                            ${item.category}
                                        </span>

                                        <!-- Game Name -->
                                        <h5 class="card-title">
                                            ${item.name}
                                        </h5>

                                        <!-- Genre -->
                                        <p class="text-white mb-2">
                                            <strong>Genre:</strong> ${item.genre}
                                        </p>

                                        <!-- Publisher -->
                                        <p class="text-white mb-2">
                                            <strong>Publisher:</strong> ${item.publisher}
                                        </p>

                                        <!-- Rating -->
                                        <p class="text-warning mb-2">
                                            <strong>Rating:</strong> ⭐ ${item.rating}
                                        </p>

                                        <!-- Platforms -->
                                        <p class="text-white mb-3">
                                            <strong>Platforms:</strong>
                                            ${item.platforms.join(", ")}
                                        </p>

                                        <!-- View Details -->
                                        <button
                                            type="button"
                                            class="btn btn-purple mt-auto"
                                            onclick="viewDetails('${item.id}')"
                                        >
                                            View Details
                                        </button>

                                    </div>

                                </div>

                            </div>

                        `).join("")}

                    </div>
                </div>
            `;

            parent.innerHTML = result;
        }


      




          function viewDetails(id) {

              // Find the selected product
              let selected_item = allData.find(
                  item => item.id === id
              );

              // Save selected product
              localStorage.setItem(
                  "selected_item",
                  JSON.stringify(selected_item)
              );

              // Go to product page
              window.location.href = "/product.html";
          }



        //   add to cart   
          let cartSize = document.getElementById('cart-size')
          let cart = JSON.parse( localStorage.getItem('cart'))
           if(cart){
              cartSize.textContent = cart.length
           }
            else{
             cartSize.textContent = 0
           }







              let userName = document.getElementById('user-name')
           let user = JSON.parse(localStorage.getItem('gamerealmCurrentUser'))


         
                    function logOut(){
                         let userInput = confirm('Do you want to Log out...?')

                         if(userInput){
                            
                             localStorage.removeItem('gamerealmCurrentUser')
                             alert('Log out successfully')


                             window.location.href = './index.html'

                         }

                    }


                    if(user){
                        userName.textContent = user.username;
                        userName.classList.remove('btn-purple')
                        userName.classList.add('btn-outline-primary')
                        userName.classList.add('text-white')
                        userName.onclick = logOut

                    }
          
          // 



          getData();
          makeUI()

      </script>
