                <!-- Logo -->

                <!-- Quick Links -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>


    <script>

                // Get selected product from localStorage
                let allData = JSON.parse(localStorage.getItem("selected_item"));

                let parent = document.querySelector(".product");


                function makeUI() {

                    // Check if product exists
                    if (!allData) {
                        parent.innerHTML = `
                            <div class="text-center text-white py-5">
                                <h3>Product not found</h3>
                                <a href="index.html" class="btn btn-primary mt-3">
                                    Back to Products
                                </a>
                            </div>
                        `;
                        return;
                    }


                    let result = `

                        <div class="row g-5 align-items-center text-white">

                            <!-- Product Image -->
                            <div class="col-12 col-md-6">

                                <div class="card border-0 shadow-sm p-4">

                                    <img
                                        src="./${allData.image}"
                                        class="img-fluid"
                                        alt="${allData.name}"
                                        style="
                                            height: 450px;
                                            object-fit: contain;
                                        "
                                    >

                                </div>

                            </div>


                            <!-- Product Information -->
                            <div class="col-12 col-md-6">

                                <!-- Brand -->
                                <span class="badge bg-primary mb-3">
                                    ${allData.brand || allData.genre}
                                </span>


                                <!-- Product Name -->
                                <h1 class="display-5 fw-bold mb-3">
                                    ${allData.name}
                                </h1>


                                <!-- Category -->
                                <p class="text-white fs-5 mb-3">
                                    ${allData.category}
                                </p>


                                <!-- Rating -->
                                ${
                                    allData.rating
                                    ? `
                                        <div class="mb-3">

                                            <span class="text-warning fs-5">
                                                <i class="fa-solid fa-star"></i>
                                                ${allData.rating}
                                            </span>

                                            <span class="text-white ms-2">
                                                (${Number(allData.reviews).toLocaleString()}
                                                reviews)
                                            </span>

                                        </div>
                                    `
                                    : ""
                                }


                                <hr>


                                <!-- Product ID -->
                                <div class="mb-3">

                                    <strong>Product ID:</strong>

                                    <span class="text-white">
                                        ${allData.id}
                                    </span>

                                </div>


                                <!-- Subcategory -->
                                ${
                                    allData.subcategory
                                    ? `
                                        <div class="mb-3">

                                            <strong>Type:</strong>

                                            <span class="text-white">
                                                ${allData.subcategory}
                                            </span>

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Platform -->
                                ${
                                    allData.platform
                                    ? `
                                        <div class="mb-3">

                                            <strong>Platform:</strong>

                                            <span class="text-white">
                                                ${allData.platform}
                                            </span>

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Platforms -->
                                ${
                                    allData.platforms
                                    ? `
                                        <div class="mb-3">

                                            <strong class="d-block mb-2">
                                                Platforms:
                                            </strong>

                                            ${allData.platforms
                                                .map(
                                                    item => `
                                                        <span class="badge bg-light text-primary border me-1 mb-1">
                                                            ${item}
                                                        </span>
                                                    `
                                                )
                                                .join("")
                                            }

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Storage -->
                                ${
                                    allData.storage
                                    ? `
                                        <div class="mb-3">

                                            <strong>Storage:</strong>

                                            <span class="text-white">
                                                ${allData.storage}
                                            </span>

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Genre -->
                                ${
                                    allData.genre
                                    ? `
                                        <div class="mb-3">

                                            <strong>Genre:</strong>

                                            <span class="text-white">
                                                ${allData.genre}
                                            </span>

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Connectivity -->
                                ${
                                    allData.connectivity
                                    ? `
                                        <div class="mb-3">

                                            <strong>Connectivity:</strong>

                                            <span class="text-warning">
                                                ${allData.connectivity}
                                            </span>

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Compatibility -->
                                ${
                                    allData.compatibility
                                    ? `
                                        <div class="mb-4">

                                            <strong class="d-block mb-2">
                                                Compatibility:
                                            </strong>

                                            ${Array.isArray(allData.compatibility)
                                                ? allData.compatibility
                                                    .map(
                                                        item => `
                                                            <span class="badge bg-light text-dark border me-1 mb-1">
                                                                ${item}
                                                            </span>
                                                        `
                                                    )
                                                    .join("")
                                                : `
                                                    <span class="badge bg-light text-dark border">
                                                        ${allData.compatibility}
                                                    </span>
                                                `
                                            }

                                        </div>
                                    `
                                    : ""
                                }


                                <!-- Add To Cart -->
                                <button
                                    type="button"
                                    class="btn btn-purple btn-lg w-100 mb-3"
                                    onclick="addToCart()"
                                >

                                    <i class="fa-solid fa-cart-plus me-2"></i>

                                    Add To Cart

                                </button>


                                <!-- Back -->
                                <a
                                    href="#"
                                    onclick ="history.back()"
                                    class="btn btn-outline-secondary btn-lg w-100"
                                >

                                    <i class="fa-solid fa-arrow-left me-2"></i>

                                    Back 

                                </a>

                            </div>

                        </div>

                    `;

                    parent.innerHTML = result;
                }


                function addToCart() {

                    // Get existing cart
                    let user = JSON.parse(localStorage.getItem('gamerealmCurrentUser'));
                    let cart = JSON.parse(
                        localStorage.getItem("cart")
                    ) || [];


                    // Add selected product
                    cart.push(allData);


                    // Save cart
                   
                    let userChoice = confirm('Do you want to Add the Item In your Cart ..?')

                    if(userChoice && user){
                           localStorage.setItem(
                        "cart",
                        JSON.stringify(cart)
                    )

                    alert(`added successfulyy ${allData.name}`)
                    updateCartSize()

                    }
                    
                     else{
          
                        alert("Log in First ")
                        window.location.href ='./login_signup.html'
                         

                    }



                    console.log("Added to cart:", allData);
                }



  

                 let cartSize = document.getElementById('cart-size')
                 let cart = JSON.parse( localStorage.getItem('cart'))


                    if(cart){
                        cartSize.textContent = cart.length
                    }


                    function updateCartSize() {

                        let cartSize = document.getElementById("cart-size");

                        let cart =
                            JSON.parse(localStorage.getItem("cart")) || [];

                        cartSize.textContent = cart.length;
                    }
                    







                    let userName = document.getElementById('user-name')
                    let user = JSON.parse(localStorage.getItem('gamerealmCurrentUser'))




                    function logOut(){
                         let userInput = confirm('Do you want to Log out...?')

                         if(userInput){
                            
                             localStorage.removeItem('gamerealmCurrentUser')
                             alert('Log out successfully')


                             window.location.href = './index.html'

                         }

                    }


                    if(user){
                        userName.textContent = user.username;
                        userName.classList.remove('btn-purple')
                        userName.classList.add('btn-outline-primary')
                        userName.classList.add('text-white')
                        userName.onclick = logOut

                    }
          




               makeUI();

            
            
    </script>

  </body>
</html>
